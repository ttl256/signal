name: Build and deploy Hugo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"
  HUGO_SHA256: "c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d"
  TZ: Europe/Moscow

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the blog and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo Extended
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          printf '%s  %s\n' "${HUGO_SHA256}" "${RUNNER_TEMP}/hugo.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build the site
        env:
          HUGO_BASEURL: "${{ steps.pages.outputs.base_url }}/"
        run: hugo --minify --cacheDir "${RUNNER_TEMP}/hugo-cache"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
